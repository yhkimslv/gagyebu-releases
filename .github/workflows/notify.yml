name: Ledger notifications

on:
  schedule:
    - cron: '*/5 * * * *'    # Every five minutes; GitHub may occasionally run it later.
  workflow_dispatch:          # Allow a manual test run from the Actions tab.

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    name: Send notifications
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install notification dependencies
        run: npm install --no-audit --no-fund
        working-directory: notify

      - name: Send Our Ledger notifications
        run: node send.js
        working-directory: notify
        env:
          APP: couple
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          COUPLE_CODE: ${{ secrets.COUPLE_CODE }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          UPDATE_URL: https://piggyduo.netlify.app/version.json

      - name: Send My Ledger notifications
        run: node send.js
        working-directory: notify
        env:
          APP: personal
          SUPABASE_URL: ${{ secrets.P_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.P_SUPABASE_KEY }}
          COUPLE_CODE: ${{ secrets.P_CODE }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          UPDATE_URL: https://piggybox.netlify.app/version.json
